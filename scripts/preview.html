<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VoxelWorld · 星球网格预览</title>
<style>
  :root { color-scheme:dark; font-family:"Segoe UI","Microsoft YaHei",sans-serif; background:#10151e; color:#dce7f5 }
  * { box-sizing:border-box }
  body { margin:0; display:grid; height:100dvh; grid-template-rows:auto minmax(0,1fr) auto }
  header, footer { display:flex; gap:12px; padding:12px 18px; align-items:center; flex-wrap:wrap }
  header { border-bottom:1px solid #29384b }
  h1 { margin:0 12px 0 0; font-size:17px; font-weight:650 }
  button { border:1px solid #435876; background:#1c2839; color:#dce7f5; border-radius:6px; padding:7px 12px; font:inherit; cursor:pointer }
  button[aria-pressed="true"] { border-color:#58cadc; background:#214654; color:#c3f7ff }
  button:focus-visible { outline:2px solid #8feafe; outline-offset:2px }
  main { position:relative; min-height:0; overflow:hidden; background:radial-gradient(ellipse at 40% 32%,#14263a,#050b16 73%); }
  canvas { width:100%; height:100%; display:block; touch-action:none; cursor:grab; }
  canvas:active { cursor:grabbing }
  footer { justify-content:space-between; color:#aabbd1; font-size:13px; border-top:1px solid #29384b }
  #error { position:absolute; top:48%; left:50%; transform:translate(-50%,-50%); font-weight:600; text-align:center }
</style>
</head>
<body>
<header>
  <h1>VoxelWorld · 星球网格预览</h1>
  <button id="orbit" aria-pressed="true">全星球</button>
  <button id="surface" aria-pressed="false">地表</button>
  <button id="invoker">下一个 Invoker</button>
  <button id="tint" aria-pressed="false">LOD 着色</button>
  <button id="ranges" aria-pressed="false">LOD 范围</button>
</header>
<main><canvas id="scene" aria-label="可旋转和缩放的星球网格"></canvas><div id="error" hidden></div></main>
<footer><span id="status" role="status">正在加载网格</span><span>拖动旋转 · 滚轮缩放</span></footer>
<script>
const mesh = /* MESH_DATA */ null;
const canvas = document.querySelector('#scene');
const status = document.querySelector('#status');
const error = document.querySelector('#error');
const orbit = document.querySelector('#orbit');
const surface = document.querySelector('#surface');
const tint = document.querySelector('#tint');

function start() {
  if (!mesh) throw new Error('预览文件未包含网格数据。');
  const gl = canvas.getContext('webgl2', {antialias:true, alpha:true});
  if (!gl) throw new Error('浏览器未能启动 WebGL 2。');
  function compile(type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader));
    return shader;
  }
  const vertex = compile(gl.VERTEX_SHADER, `#version 300 es
    layout(location=0) in vec3 point;
    layout(location=2) in vec3 pointLow;
    layout(location=1) in uint level;
    uniform vec3 eye, eyeLow, right, up, forward;
    uniform vec4 projection;
    out vec3 world;
    flat out uint lod;
    void main() {
      vec3 s = point - eye;
      vec3 v = s - point;
      vec3 e = (point - (s - v)) + (-eye - v);
      vec3 relative = s + (e + pointLow - eyeLow);
      float depth = dot(relative, forward);
      gl_Position = vec4(dot(relative,right)*projection.x, dot(relative,up)*projection.y,
                         depth*projection.z + projection.w, depth);
      world = relative;
      lod = level;
    }`);
  const fragment = compile(gl.FRAGMENT_SHADER, `#version 300 es
    precision highp float;
    precision highp int;
    in vec3 world;
    flat in uint lod;
    uniform vec3 sun, forward, eye, eyeLow;
    uniform bool useTint, wireMode;
    out vec4 color;
    void main() {
      if (wireMode) {
        if (lod == 0u) color = vec4(.25,.91,1,1);
        if (lod == 1u) color = vec4(.40,1,.54,1);
        if (lod == 2u) color = vec4(1,.76,.28,1);
        if (lod == 3u) color = vec4(.81,.53,1,1);
        if (lod >= 4u) color = vec4(mix(vec3(.95,.35,.22),vec3(.12,.22,.46),clamp((float(lod)-4.0)/8.0,0.0,1.0)),1);
        return;
      }
      vec3 radial = normalize(world + eye + eyeLow);
      vec3 n = normalize(cross(dFdx(world), dFdy(world)));
      if (dot(n,radial) < 0.0) n = -n;
      float height = clamp((length(world + eye + eyeLow)-6370340.0)/850.0, 0.0, 1.0);
      float rock = clamp(2.4 * (1.0 - dot(n,radial)), 0.0, 1.0);
      vec3 tone = vec3(.35,.41,.47) + vec3(.31,.18,.06)*height + vec3(.09,.04,.03)*rock;
      if (useTint) {
        if (lod == 0u) tone=vec3(.18,.74,.84);
        if (lod == 1u) tone=vec3(.32,.70,.43);
        if (lod == 2u) tone=vec3(.87,.65,.28);
        if (lod == 3u) tone=vec3(.54,.46,.68);
        if (lod >= 4u) tone=mix(vec3(.95,.35,.22),vec3(.12,.22,.46),clamp((float(lod)-4.0)/8.0,0.0,1.0));
      }
      float rim = pow(1.0 - abs(dot(n,forward)),3.0);
      color = vec4(tone*(.26+.74*max(0.0,dot(n,sun))) + rim*vec3(.03,.046,.07), 1.0);
    }`);
  const program = gl.createProgram();
  gl.attachShader(program, vertex);
  gl.attachShader(program, fragment);
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));
  gl.useProgram(program);
  const uniforms = {};
  for (const key of ['eye','eyeLow','right','up','forward','projection','sun','useTint','wireMode']) {
    uniforms[key] = gl.getUniformLocation(program, key);
  }
  const decode = (encoded) => Uint8Array.from(atob(encoded), (value) => value.charCodeAt(0));
  const positions = new Float64Array(decode(mesh.positions).buffer);
  const levels = decode(mesh.levels);
  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  function attribute(index, values) {
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, values, gl.STATIC_DRAW);
    gl.enableVertexAttribArray(index);
  }
  const uploadPoints = (points) => {
    const hi = new Float32Array(points.length), lo = new Float32Array(points.length);
    for (let i = 0; i < points.length; ++i) { hi[i] = points[i]; lo[i] = points[i] - hi[i]; }
    attribute(0, hi);
    gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
    attribute(2, lo);
    gl.vertexAttribPointer(2, 3, gl.FLOAT, false, 0, 0);
  };
  uploadPoints(positions);
  attribute(1, levels);
  gl.vertexAttribIPointer(1, 1, gl.UNSIGNED_BYTE, 0, 0);
  const wires = gl.createVertexArray();
  const linePoints = [], lineLevels = [];
  const ranges = document.querySelector('#ranges');
  for (const [, lod, x0, y0, z0, x1, y1, z1] of mesh.windows ?? []) {
    for (let i = 0; i < 8; ++i) for (let a = 0; a < 3; ++a) {
      if (i & (1 << a)) continue;
      const start = [i & 1 ? x1 : x0, i & 2 ? y1 : y0, i & 4 ? z1 : z0];
      const end = start.slice();
      end[a] = [x1, y1, z1][a];
      linePoints.push(...start, ...end);
      lineLevels.push(lod, lod);
    }
  }
  ranges.disabled = lineLevels.length === 0;
  gl.bindVertexArray(wires);
  uploadPoints(linePoints);
  attribute(1, new Uint8Array(lineLevels));
  gl.vertexAttribIPointer(1, 1, gl.UNSIGNED_BYTE, 0, 0);
  gl.enable(gl.DEPTH_TEST);
  gl.clearColor(0,0,0,0);

  const mul = (v, value) => v.map((x) => x * value);
  const add = (a, b) => a.map((x, i) => x + b[i]);
  const sub = (a, b) => a.map((x, i) => x - b[i]);
  const cross = (a,b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
  const unit = (v) => mul(v, 1 / Math.hypot(...v));
  const clamp = (x, lo, hi) => Math.min(hi, Math.max(lo,x));
  const initial = new URLSearchParams(location.hash.slice(1));
  let local = initial.get('view') === 'surface', useTint = initial.get('lod') === '1';
  let showRanges = initial.get('ranges') === '1' && lineLevels.length !== 0;
  let selected = clamp((parseInt(initial.get('invoker'), 10) || 1) - 1, 0, mesh.invokers.length - 1);
  let yaw = .13, pitch = .16, distance = 2.5 * 6371000;
  let bearing = .42, elevation = .90, surfaceDistance = 1950;
  let updateQueued = false, previous = null;
  const count = (levels.length / 3).toLocaleString('zh-CN');
  function draw() {
    updateQueued = false;
    const scale = Math.min(devicePixelRatio || 1, 2);
    const width = Math.max(1, Math.round(canvas.clientWidth*scale));
    const height = Math.max(1, Math.round(canvas.clientHeight*scale));
    if (canvas.width !== width || canvas.height !== height) { canvas.width = width; canvas.height = height; }
    const target = mesh.invokers[selected], radial = unit(target);
    const x = unit(cross(Math.abs(radial[2]) < .9 ? [0,0,1] : [0,1,0],radial));
    const y = cross(radial,x);
    let eye, center, nominalUp, near;
    if (local) {
      center = target;
      const tangent = add(mul(x,Math.cos(bearing)),mul(y,Math.sin(bearing)));
      const offset = add(mul(radial,Math.sin(elevation)),mul(tangent,Math.cos(elevation)));
      eye = add(center,mul(offset,surfaceDistance));
      nominalUp = radial;
      near = Math.max(.4,surfaceDistance*.004);
    } else {
      center = [0,0,0];
      eye = mul(add(add(mul(radial,Math.cos(yaw)*Math.cos(pitch)),mul(x,Math.sin(yaw)*Math.cos(pitch))),mul(y,Math.sin(pitch))),distance);
      nominalUp = y;
      near = Math.max(12,(distance-6371000)*.03);
    }
    const forward = unit(sub(center,eye)), right = unit(cross(forward,nominalUp)), up = unit(cross(right,forward));
    const sun = unit(add(add(mul(right,-.68),mul(up,.6)),mul(forward,-.64)));
    const far = 20 * 6371000;
    gl.viewport(0,0,width,height);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    const eyeHi = eye.map(Math.fround), eyeLow = eye.map((x, i) => x - eyeHi[i]);
    for (const [key, value] of Object.entries({eye:eyeHi,eyeLow,right,up,forward,sun})) gl.uniform3fv(uniforms[key], value);
    gl.uniform4f(uniforms.projection, 1.92*height/width, 1.92, (far+near)/(far-near), -2*near*far/(far-near));
    gl.uniform1i(uniforms.useTint, useTint ? 1 : 0);
    gl.uniform1i(uniforms.wireMode, 0);
    gl.bindVertexArray(vao);
    gl.drawArrays(gl.TRIANGLES, 0, levels.length);
    if (showRanges) {
      gl.disable(gl.DEPTH_TEST);
      gl.uniform1i(uniforms.wireMode, 1);
      gl.bindVertexArray(wires);
      gl.drawArrays(gl.LINES, 0, lineLevels.length);
      gl.enable(gl.DEPTH_TEST);
    }
    canvas.dataset.state = 'rendered';
  }
  function schedule() {
    if (!updateQueued) { updateQueued = true; requestAnimationFrame(draw); }
  }
  function updateControls() {
    orbit.setAttribute('aria-pressed', String(!local));
    surface.setAttribute('aria-pressed', String(local));
    tint.setAttribute('aria-pressed', String(useTint));
    ranges.setAttribute('aria-pressed', String(showRanges));
    const legend = useTint || showRanges ? ' · 青 50 m / 绿 100 m / 金 200 m / 紫 400 m / LOD 4+ 红至蓝，间距逐级翻倍' : '';
    const camera = mesh.camera ? ' + 导出摄像机' : '';
    status.textContent = `6,371 km 基准半径 · ${count} 个三角形 · Invoker ${selected + 1}/${mesh.invokers.length}${camera}${legend}`;
    schedule();
  }
  orbit.onclick = () => { local = false; updateControls(); };
  surface.onclick = () => { local = true; updateControls(); };
  tint.onclick = () => { useTint = !useTint; updateControls(); };
  ranges.onclick = () => { showRanges = !showRanges; updateControls(); };
  document.querySelector('#invoker').onclick = () => { selected = (selected + 1) % mesh.invokers.length; updateControls(); };
  canvas.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    canvas.setPointerCapture(e.pointerId);
    previous = [e.clientX,e.clientY];
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!previous) return;
    const dx = (e.clientX-previous[0])*.006, dy = (e.clientY-previous[1])*.006;
    if (local) { bearing -= dx; elevation = clamp(elevation+dy,.24,1.46); }
    else { yaw -= dx; pitch = clamp(pitch+dy,-1.35,1.35); }
    previous = [e.clientX,e.clientY];
    schedule();
  });
  canvas.addEventListener('lostpointercapture', () => { previous = null; });
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const zoom = Math.exp(clamp(e.deltaY,-200,200)*.0017);
    if (local) surfaceDistance = clamp(surfaceDistance*zoom,150,10500);
    else distance = clamp(distance*zoom,1.02*6371000,8*6371000);
    schedule();
  }, {passive:false});
  new ResizeObserver(schedule).observe(canvas);
  updateControls();
}

try { start(); } catch (cause) {
  error.textContent = cause.message;
  error.hidden = false;
  status.textContent = '预览启动失败';
}
</script>
</body>
</html>
